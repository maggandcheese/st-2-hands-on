<html>

<head>

<title> GALLERY </title>

<style>

body{

            background-color:#FFF4DE;

            text-align: center;

}

h1 {

            color: #AF719D;

            font-size: 70px;

            font-weight: bold;

            font-family: Arial, Helvetica, sans-serif;

            background-color: #FFCED8;

            padding:20px;

            border-radius: 12px;

            border: 4px dashed #AF719D;

            box-shadow: 0 8px 8px rgb(240, 149, 179);

}

.main {

            margin:50px.auto;

            display: grid;

            grid-template-columns: repeat(5,320px);

            gap: 80px;

}

img {

            width:300px;

            height:300px;

            border-radius:10px;

            box-shadow: 0 2px 2px palevioletred;

}

img:hover {

            transform: translateY(-10px) rotate(2deg);

}

.main:hover > :not(:hover){

            filter: blur (50px);

            opacity: 0.5;

}



</style>

</head>



<body>

<h1> PHOTO COLLECTION </h1> 

<div class="main">

<img src="1.png">

<img src="2.png">

<img src="3.png">

<img src="4.png">

<img src="5.png">

<img src="6.png">

<img src="7.png">

<img src="8.png">
<img src="9.png">

<img src="10.png">

</div>

<br>



</body>

</html>
